<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">
        <!-- Header with Progress and Timer -->
        <header class="quiz-header">
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="quiz-meta">
                <span id="question-counter">Question 1 of 5</span>
                <div class="timer-box">
                    ⏱️ <span id="timer">15</span>s
                </div>
            </div>
        </header>

        <!-- Main Quiz Card -->
        <main id="quiz-box" class="card">
            <h2 id="question" class="question-text">Loading question...</h2>

            <div id="options" class="options-grid">
                <!-- Dynamic options generated by JS -->
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="explanation-box hidden">
                <h4>💡 Explanation:</h4>
                <p id="explanation-text"></p>
            </div>

            <footer class="quiz-footer">
                <button id="next-btn" class="btn primary-btn hidden">Next Question ➔</button>
            </footer>
        </main>

        <!-- Final Result Card -->
        <main id="result-box" class="card hidden">
            <div class="result-content">
                <div class="trophy-icon">🏆</div>
                <h2>Quiz Completed!</h2>
                <div class="score-badge">
                    <span id="score-text">0 / 0</span>
                </div>
                <p id="feedback-message">Great job completing the quiz!</p>
                <div id="review-container" class="review-container" style="text-align: left; margin: 20px 0; max-height: 300px; overflow-y: auto; font-size: 0.9em; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);"></div>
                <button id="restart-btn" class="btn primary-btn">🔄 Play Again</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
