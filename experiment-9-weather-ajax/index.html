<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8 />
  <meta name=viewport content=width=device-width, initial-scale=1.0 />
  <title>Lab 9: Weather Dashboard (AJAX & JSON)</title>
  <link rel=stylesheet href=style.css />
  <link rel=preconnect href=https://fonts.googleapis.com>
  <link rel=preconnect href=https://fonts.gstatic.com crossorigin>
  <link href=https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap rel=stylesheet>
</head>
<body>
  <div class=app-wrapper>
    <div class=glass-card>
      <header class=app-header>
        <div class=badge>Lab Experiment #9</div>
        <h1>Live Weather Portal</h1>
        <p class=subtitle>Asynchronous Weather Retrieval using AJAX / Fetch API & JSON</p>
      </header>

      <!-- Search Section -->
      <form id=weather-form class=search-box onsubmit=return false;>
        <div class=input-group>
          <span class=search-icon>🔍</span>
          <input 
            type=text 
            id=city-input 
            placeholder=Enter city name (e.g. Puducherry, London) 
            autocomplete=off
            required 
          />
          <button type=button id=clear-btn class=clear-btn aria-label=Clear input>&times;</button>
        </div>
        <button type=submit id=search-btn class=btn-search>
          <span>Get Weather</span>
        </button>
      </form>

      <!-- Quick Chips -->
      <div class=chips-row>
        <span class=chips-label>Popular:</span>
        <button class=chip data-city=Puducherry>Puducherry</button>
        <button class=chip data-city=New Delhi>New Delhi</button>
        <button class=chip data-city=London>London</button>
        <button class=chip data-city=Tokyo>Tokyo</button>
        <button class=chip data-city=New York>New York</button>
      </div>

      <!-- Weather Result Display Area (ARIA Live for accessibility) -->
      <div id=weather-result class=weather-result-box aria-live=polite>
        <div class=empty-state>
          <div class=empty-icon>🌤️</div>
          <p>Search for a city above to inspect live temperature, weather conditions, humidity, and wind speed.</p>
        </div>
      </div>

      <footer class=app-footer>
        <div class=spec-pills>
          <span class=pill>AJAX: fetch()</span>
          <span class=pill>Format: JSON</span>
          <span class=pill>DOM: Zero Reload</span>
        </div>
      </footer>
    </div>
  </div>

  <script src=app.js></script>
</body>
</html>
